<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Font Awesome (for icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body class="contact-page">

  <!-- HEADER -->
  <header class="contact-header">
    <img src="images/logo.png" class="header-logo" alt="Urban Logo">

    <div class="header-right">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
    </div>
  </header>

  <!-- CONTACT SECTION -->
  <section class="contact-page-section">
    <h2 class="contact-title">Contact US</h2>

    <div class="contact-wrapper">

      <!-- LEFT INFO -->
      <div class="contact-info-box">
        <div class="info-row">
          <i class="fa-solid fa-phone"></i>
          <span>+1012 3456 789</span>
        </div>

        <div class="info-row">
          <i class="fa-solid fa-envelope"></i>
          <span>demo@gmail.com</span>
        </div>

        <div class="info-row address">
          <i class="fa-solid fa-location-dot"></i>
          <span>
            132 Dartmouth Street Boston,<br>
            Massachusetts 02156 United States
          </span>
        </div>
      </div>

      <!-- FORM CARD -->
      <div class="contact-form-card">
        <form>

          <input type="text" placeholder="Enter the name" required>
          <input type="text" placeholder="Enter the phone number" required>
          <input type="email" placeholder="Enter email" required>

          <div class="select-box">
            <p class="select-title">Select ?</p>

            <div class="radio-row">
              <label><input type="radio" name="type" checked> Row House</label>
              <label><input type="radio" name="type"> Flats</label>
              <label><input type="radio" name="type"> Plots</label>
              <label><input type="radio" name="type"> Shops</label>
            </div>
          </div>

          <button class="send-btn" type="submit">Send Message</button>
        </form>
      </div>

    </div>
  </section>

  <!-- FOOTER -->
  <footer class="contact-footer">
    <img src="images/logo.png" alt="Urban Logo">

    <p class="footer-text">© 2020 Lift Media. All rights reserved.</p>

    <div class="footer-social">
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-twitter"></i></a>
    </div>
  </footer>

</body>
</html>
