<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="logo">
    <img src="./images/urban logo.png" alt="Urban Logo">
    <div class="logo-text">
        <h3>URBAN</h3>
        <small>NASHIK PROPERTIES</small>
    </div>
</div>

    <nav>
        <a href="#">Home</a>
        <a href="#">About Us</a>
    </nav>
</header>

<!-- Contact -->
<section class="contact">
    <h2>Contact US</h2>

    <div class="contact-box">

        <!-- Left Shape -->
        <div class="left-panel">
            <p>📞 +1012 3456 789</p>
            <p>✉ demo@gmail.com</p>
            <p>
                📍 132 Dartmouth Street Boston,<br>
                Massachusetts 02156 United States
            </p>
        </div>

        <!-- Right Form -->
        <div class="form-panel">
            <input type="text" placeholder="Enter the name">
            <input type="text" placeholder="Enter the phone number">
            <input type="email" placeholder="Enter email">

            <div class="radio-box">
                <p>Select ?</p>
                <label><input type="radio" name="type"> Row House</label>
                <label><input type="radio" name="type"> Flats</label>
                <label><input type="radio" name="type"> Plots</label>
                <label><input type="radio" name="type"> Shops</label>
            </div>

            <button onclick="sendMessage()">Send Message</button>
        </div>

    </div>
</section>

<!-- Footer -->
<footer>
    <div class="logo">
    <img src="./images/urban logo.png" alt="Urban Logo">
    <div class="logo-text">
        <h3>URBAN</h3>
        <small>NASHIK PROPERTIES</small>
    </div>
</div>

    <p>© 2020 Lift Media. All rights reserved.</p>
    <div class="social">
        <span>f</span>
        <span>i</span>
        <span>t</span>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
